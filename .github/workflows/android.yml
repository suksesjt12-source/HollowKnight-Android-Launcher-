name: Nightfall Android Runtime APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "custom/mediatek-ui" ]

permissions:
  contents: read

concurrency:
  group: nightfall-android-build-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: "28.2.13676358"
  CMAKE_VERSION: "3.31.6"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout project and emulator engine
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Free disk space for native C++ build
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/lib/android/sdk/ndk /usr/local/lib/android/sdk/emulator \
            /usr/local/lib/android/sdk/system-images || true
          df -h /

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('third_party/Lemon-Project/src/android/**/*.gradle*', 'third_party/Lemon-Project/src/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache emulator native dependencies
        uses: actions/cache@v4
        with:
          path: |
            third_party/Lemon-Project/.cache/cpm
          key: nightfall-cpm-${{ runner.os }}-${{ hashFiles('third_party/Lemon-Project/cpmfile.json') }}
          restore-keys: |
            nightfall-cpm-${{ runner.os }}-

      - name: Cache C++ compiler output
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: nightfall-ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            nightfall-ccache-${{ runner.os }}-

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools ccache

      - name: Install Android platform, NDK and CMake
        run: |
          SDK_MANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDK_MANAGER" --licenses > /dev/null
          "$SDK_MANAGER" \
            "platforms;android-36" \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"

      - name: Install custom launcher, profiles and app identity
        working-directory: third_party/Lemon-Project
        run: |
          cp "$GITHUB_WORKSPACE/custom-ui/HollowHomeScreen.kt" \
            src/android/app/src/main/java/dev/lemon/lemon_emu/ui/HollowHomeScreen.kt
          cp "$GITHUB_WORKSPACE/custom-ui/MediaTekProfiles.kt" \
            src/android/app/src/main/java/dev/lemon/lemon_emu/utils/MediaTekProfiles.kt
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path("src/android/app/build.gradle.kts")
          source = gradle.read_text()
          start = source.index('create("mainline") {')
          end = source.index('create("lite") {', start)
          block = source[start:end]

          block = block.replace(
              'manifestPlaceholders += mapOf("appNameBase" to "Lemon")',
              'manifestPlaceholders += mapOf("appNameBase" to "Nightfall Runtime")'
          )
          block = block.replace(
              'resValue("string", "app_name_suffixed", "Lemon")',
              'resValue("string", "app_name_suffixed", "Nightfall Runtime")'
          )
          if 'applicationId = "com.suksesjt12.hollowknight.switch"' not in block:
              block = block.replace(
                  'dimension = "version"',
                  'dimension = "version"\n            applicationId = "com.suksesjt12.hollowknight.switch"',
                  1
              )

          required = [
              'Nightfall Runtime',
              'applicationId = "com.suksesjt12.hollowknight.switch"'
          ]
          if not all(item in block for item in required):
              raise SystemExit("App identity patch failed; refusing to build the stock app")

          gradle.write_text(source[:start] + block + source[end:])

          fragment_path = Path(
              "src/android/app/src/main/java/dev/lemon/lemon_emu/ui/ModernGamesFragment.kt"
          )
          fragment = fragment_path.read_text()
          old = """                    ModernLibraryScreen(
                        games = games,
                        loading = reloading,
                        preferences = preferences,
                        initialSelectedPath = lastPlayedPath,
                        showQLaunch = BooleanSetting.ENABLE_QLAUNCH_BUTTON.getBoolean() &&
                            NativeLibrary.isFirmwareAvailable(),
                        actions = actions
                    )"""
          new = """                    HollowHomeScreen(
                        games = games,
                        loading = reloading,
                        actions = actions
                    )"""
          if old not in fragment:
              raise SystemExit("Could not find the original library screen call; refusing a partial UI patch")
          fragment_path.write_text(fragment.replace(old, new, 1))
          PY

      - name: Build Nightfall ARM64 APK from standard engine flavor
        working-directory: third_party/Lemon-Project
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION"
          export CCACHE_DIR="$HOME/.cache/ccache"
          mkdir -p "$CCACHE_DIR"
          ccache --max-size=5G
          chmod +x .ci/android/build.sh
          CCACHE=true .ci/android/build.sh -t standard -b Release
          ccache --show-stats

      - name: Upload Nightfall APK
        uses: actions/upload-artifact@v4
        with:
          name: Nightfall-MediaTek-ARM64
          path: third_party/Lemon-Project/artifacts/*.apk
          if-no-files-found: error
          retention-days: 14
