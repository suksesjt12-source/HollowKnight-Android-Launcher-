name: Android Emulator APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: android-emulator-build-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: "28.2.13676358"
  CMAKE_VERSION: "3.31.6"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository and emulator source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Free disk space for native C++ build
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/lib/android/sdk/ndk /usr/local/lib/android/sdk/emulator \
            /usr/local/lib/android/sdk/system-images || true
          df -h /

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('third_party/Lemon-Project/src/android/**/*.gradle*', 'third_party/Lemon-Project/src/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache Lemon native dependencies
        uses: actions/cache@v4
        with:
          path: |
            third_party/Lemon-Project/.cache/cpm
          key: lemon-cpm-${{ runner.os }}-${{ hashFiles('third_party/Lemon-Project/cpmfile.json') }}
          restore-keys: |
            lemon-cpm-${{ runner.os }}-

      - name: Cache C++ compiler output
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: lemon-ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            lemon-ccache-${{ runner.os }}-

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools ccache

      - name: Install Android platform, NDK and CMake
        run: |
          SDK_MANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDK_MANAGER" --licenses > /dev/null
          "$SDK_MANAGER" \
            "platforms;android-36" \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"

      - name: Apply Hollow Knight Android app branding
        working-directory: third_party/Lemon-Project
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/android/app/build.gradle.kts")
          source = path.read_text()
          start = source.index('create("lite") {')
          end = source.index('create("liteSpoofed") {', start)
          block = source[start:end]
          block = block.replace('manifestPlaceholders += mapOf("appNameBase" to "Lemon Lite")', 'manifestPlaceholders += mapOf("appNameBase" to "Hollow Knight Android")')
          block = block.replace('resValue("string", "app_name_suffixed", "Lemon Lite")', 'resValue("string", "app_name_suffixed", "Hollow Knight Android")')
          block = block.replace('applicationId = "dev.lemon.lemon_emulator.lite"', 'applicationId = "com.suksesjt12.hollowknight.switch"')
          if 'Hollow Knight Android' not in block or 'com.suksesjt12.hollowknight.switch' not in block:
              raise SystemExit("Branding patch did not apply; refusing to build an unbranded APK")
          path.write_text(source[:start] + block + source[end:])
          PY

      - name: Build Hollow Knight Android ARM64 APK
        working-directory: third_party/Lemon-Project
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION"
          export CCACHE_DIR="$HOME/.cache/ccache"
          mkdir -p "$CCACHE_DIR"
          ccache --max-size=5G
          chmod +x .ci/android/build.sh
          CCACHE=true .ci/android/build.sh -t lite -b Release
          ccache --show-stats

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HollowKnight-Android-ARM64
          path: third_party/Lemon-Project/artifacts/*.apk
          if-no-files-found: error
          retention-days: 14
