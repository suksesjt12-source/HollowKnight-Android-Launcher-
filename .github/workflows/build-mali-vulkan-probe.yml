name: Build Mali Vulkan diagnostic APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'build_probe.sh'
      - '.github/workflows/build-mali-vulkan-probe.yml'

permissions:
  contents: read

concurrency:
  group: mali-vulkan-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout this builder
        uses: actions/checkout@v4

      - name: Checkout pinned nx2android probe sources
        uses: actions/checkout@v4
        with:
          repository: shirai91/nx2android
          ref: 5afd9647ee6fb7281798d77c41606822517afb8d
          path: upstream/nx2android
          persist-credentials: false

      - name: Verify preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-not-set}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-not-set}"
          command -v sdkmanager
          sdkmanager --version

      - name: Install Android NDK r27c
        run: sdkmanager --install "ndk;27.2.12479018"

      - name: Check build script syntax
        run: bash -n build_probe.sh

      - name: Build native diagnostic library and APK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          ./build_probe.sh "$SDK_ROOT/ndk/27.2.12479018"

      - name: Upload diagnostic APK
        uses: actions/upload-artifact@v4
        with:
          name: nx2a-mali-vulkan-probe
          path: build/nx2a-probe.apk
          if-no-files-found: error
          retention-days: 14
